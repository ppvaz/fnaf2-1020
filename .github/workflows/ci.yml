name: CI

# Runs exactly the checks CLAUDE.md defines. The `--browser` suite is
# deliberately absent: it drives a trainer graded in real-time milliseconds,
# and a shared CI runner is exactly the load that degrades it — a fail there
# would say nothing about the code. Deployment needs no job either: GitHub
# Pages serves the trainer straight from `master`, with nothing to build.

on:
  push:
    branches: [master, refactor]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the pinned workspace toolchain
        run: npm ci
      - name: Type and architecture contracts
        run: npm run typecheck && npm run test:unit && npm run test:contracts
      - name: Clean-checkout model lane
        run: npm run test:core
      - name: Trainer build
        run: npm run build:trainer
      - name: Fixture device dry-run
        run: npm run device:dry-run -- --profile fixture-hid-screencap
      - name: Documentation and catalog links
        run: npm run catalog && git diff --exit-code -- docs/architecture/generated && node tools/test-docs.mjs
      # The engine suite compiles the cue helper's CueDetector on the host. The
      # runner image happens to ship a JDK, but pinning one here is the point:
      # the check must fail because the detector regressed, never because the
      # image's Java moved. test.sh refuses to run without a working javac
      # rather than skipping, so an unpinned JDK would turn into a red build
      # that says nothing about the code.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Four device checks (menu selector, interaction classifier, screenstate,
      # sensor) synthesise their fixtures with Pillow. The runner image ships
      # no Pillow, so they failed on `ModuleNotFoundError: No module named
      # 'PIL'` -- a red build that said nothing about the code. Pinned for the
      # same reason as the JDK above: the check must fail because a classifier
      # regressed, never because the image's Python moved.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixture rendering dependency
        run: python3 -m pip install --disable-pip-version-check 'pillow==12.3.0'
      # The repository has sourced mksh fragments as well as executable bash
      # scripts. ShellCheck's critical tier catches unknown shell context and
      # parse/expansion errors without pretending the existing warning backlog
      # is already resolved. The image tag is the toolchain pin.
      - name: ShellCheck critical diagnostics
        run: |
          docker run --rm -v "$PWD:/mnt:ro" koalaman/shellcheck-alpine:v0.10.0 \
            sh -c 'find /mnt -type f -name "*.sh" -not -path "/mnt/.git/*" \
              -not -path "/mnt/captures/*" -not -path "/mnt/dist/*" \
              -not -path "/mnt/android/cue-helper/build/*" -print0 |
              xargs -0 shellcheck -S error'
      - name: Shell footgun regressions
        run: tools/device/test-shell-footguns.sh
      # The full historical campaign remains an explicit local/release lane;
      # its deliberately red negative experiments are not a green edit gate.
      - name: Cue helper query (mock ADB)
        run: tools/device/test-query-cue-helper.sh
      - name: Cue helper soak (mock ADB)
        run: tools/device/test-soak-cue-helper.sh
