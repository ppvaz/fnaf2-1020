name: CI

# Runs exactly the checks CLAUDE.md defines. The `--browser` suite is
# deliberately absent: it drives a trainer graded in real-time milliseconds,
# and a shared CI runner is exactly the load that degrades it — a fail there
# would say nothing about the code. Deployment needs no job either: GitHub
# Pages serves the trainer straight from `master`, with nothing to build.

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The engine suite compiles the cue helper's CueDetector on the host. The
      # runner image happens to ship a JDK, but pinning one here is the point:
      # the check must fail because the detector regressed, never because the
      # image's Java moved. test.sh refuses to run without a working javac
      # rather than skipping, so an unpinned JDK would turn into a red build
      # that says nothing about the code.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Four device checks (menu selector, interaction classifier, screenstate,
      # sensor) synthesise their fixtures with Pillow. The runner image ships
      # no Pillow, so they failed on `ModuleNotFoundError: No module named
      # 'PIL'` -- a red build that said nothing about the code. Pinned for the
      # same reason as the JDK above: the check must fail because a classifier
      # regressed, never because the image's Python moved.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixture rendering dependency
        run: python3 -m pip install --disable-pip-version-check 'pillow==12.3.0'
      - name: Engine checks
        run: node tools/test.mjs --engine --extended
      - name: Cue helper query (mock ADB)
        run: tools/device/test-query-cue-helper.sh
      - name: Cue helper soak (mock ADB)
        run: tools/device/test-soak-cue-helper.sh
